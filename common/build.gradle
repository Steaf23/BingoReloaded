plugins {
    id 'java-library'
}

repositories {
    maven {
        url "https://libraries.minecraft.net"
    }
}

dependencies {
    implementation project(":protocol")

    compileOnlyApi("commons-io:commons-io:2.19.0")
    compileOnlyApi("com.google.code.gson:gson:2.13.1")
    compileOnlyApi("org.slf4j:slf4j-api:2.0.17")

    compileOnlyApi("net.kyori:adventure-api:${adventure_version}")
    compileOnlyApi("net.kyori:adventure-text-logger-slf4j:${adventure_version}")
    compileOnlyApi("net.kyori:adventure-text-minimessage:${adventure_version}")
    compileOnlyApi("net.kyori:adventure-text-serializer-plain:${adventure_version}")
    compileOnlyApi("net.kyori:adventure-text-serializer-legacy:${adventure_version}")

    compileOnlyApi("com.mojang:brigadier:1.0.18")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}